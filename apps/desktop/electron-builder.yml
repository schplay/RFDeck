appId: com.rfdeck.desktop
productName: RFDeck
directories:
  output: release
  buildResources: resources

# asar is disabled deliberately. The app spawns a Node server sidecar and loads
# a Prisma native engine (.node); both are awkward to run from inside an asar
# archive, and the packed size saving is not worth the failure modes on a build
# that has to work unattended in a venue.
asar: false

files:
  - dist/**/*
  - package.json

# @rfdeck/server is pulled in as a workspace dependency to bring its runtime
# dependencies along, which also drags in its .env and the developer's own
# database. `files` exclusions do not apply to bundled dependencies, so they are
# stripped after packaging instead — see scripts/afterPack.cjs for why both are
# correctness problems and not merely size.
afterPack: scripts/afterPack.cjs

# The Electron shell is only a wrapper — the frontend and the Fastify server
# live in sibling workspace packages and must be copied in explicitly. Without
# these the packaged app has no UI and no backend, which is exactly the state
# the previous build shipped in.
extraResources:
  - from: ../web/dist
    to: web
  # The server goes *inside* app/ so that Node's module resolution walks up
  # into app/node_modules, where electron-builder put its dependencies. Placed
  # as a sibling of app/ instead, every `require('fastify')` fails.
  - from: ../server/dist
    to: app/server/dist
  - from: ../server/prisma/schema.prisma
    to: app/server/prisma/schema.prisma
  # Pins the server tree to CommonJS. Node decides module format from the
  # nearest package.json up the tree, which would otherwise be the Electron
  # shell's — and that declares "type": "module".
  - from: resources/server-package.json
    to: app/server/package.json
  # Empty database with the schema already applied. Copied into the user data
  # directory on first run; later schema changes are applied by `prisma db push`
  # on every start (applySchema in src/main.ts), using the CLI this package ships.
  - from: resources/template.db
    to: template.db
  # The generated Prisma client and its native query engine. Build output rather
  # than a declared dependency, so electron-builder's dependency walk misses it.
  - from: resources/prisma-client
    to: app/node_modules/.prisma/client

win:
  target: nsis

# macOS. The two usage strings are not decoration: without them macOS refuses
# the microphone (no audio capture at all) and, from macOS 15, local-network
# access (no discovery, no telemetry), and the user is never asked.
mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  extendInfo:
    NSMicrophoneUsageDescription: RFDeck captures the audio inputs you patch to channels, so you can listen to them and it can catch audio problems.
    NSLocalNetworkUsageDescription: RFDeck finds and monitors the wireless receivers on your network.
    NSBonjourServices:
      - _ssc._tcp
      - _ssc._udp
      - _sennheiser-ssc._tcp

# Linux. The server captures audio with arecord there rather than ffmpeg, so
# the package depends on alsa-utils; the AppImage cannot declare it, and says
# so through the capture error if it is missing.
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: RFDeck

deb:
  depends:
    - alsa-utils

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
