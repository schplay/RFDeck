<script>
        // Simple toggle interaction logic for UI demonstration
        const dhcpToggle = document.getElementById('dhcp-toggle');
        const ipInputs = document.querySelectorAll('input[type="text"]');
        
        dhcpToggle.addEventListener('change', (e) => {
            ipInputs.forEach(input => {
                input.disabled = e.target.checked;
                if(e.target.checked) {
                    input.classList.add('opacity-50');
                } else {
                    input.classList.remove('opacity-50');
                }
            });
        });
        
        // Initial state application
        if(dhcpToggle.checked) {
            ipInputs.forEach(input => input.classList.add('opacity-50'));
        }
    </script>
