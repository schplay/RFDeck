# Runs on every push and pull request: typecheck every package, run the test
# suite, and build the web bundle.
#
# Nothing ran these automatically before. The regex-escape bug that capped
# every audio device at two channels would have been caught by the parser
# tests the moment they existed — had anything been running them.
#
# The desktop app is packaged on each platform it ships for, on that platform:
# the Prisma query engine and ffmpeg are native binaries, so a Windows runner
# cannot produce a working macOS or Linux build.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma reads the datasource URL at generate time even though it does
      # not connect. Any SQLite path will do.
      DATABASE_URL: file:./ci.db
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json, so the
      # pin lives in one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rfdeck/server exec prisma generate

      # Every package under packages/, not a named list.
      #
      # This step used to name `@rfdeck/shared-types` alone, which was fine only for
      # as long as it was the sole package anything imported. The moment
      # `@rfdeck/shared-utils` gained its first real consumer, the server typecheck
      # failed here with "cannot find module" — the package resolves through
      # `dist/index.d.ts`, and `dist` is gitignored, so an unbuilt package is an
      # unresolvable import. A glob means the next package added does not repeat it.
      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck server
        run: pnpm --filter @rfdeck/server exec tsc --noEmit

      # The Meros Cloud client is the shared meros-client helper, built from
      # source at the commit pinned in apps/server/package.json. The cloud tests
      # drive it against RFDeck's fake Meros.
      - uses: dtolnay/rust-toolchain@stable

      - name: Build the meros-client helper
        run: pnpm --filter @rfdeck/server build:meros-client

      - name: Typecheck web
        run: pnpm --filter @rfdeck/web exec tsc --noEmit

      - name: Test
        run: pnpm --filter @rfdeck/server test

      # The shared packages have their own suites and were not being run at all.
      # `stagePlot` in particular guards an integer-only coordinate space that the
      # show file's content hash depends on, which is exactly the kind of quiet
      # property a test only helps with if something runs it.
      - name: Test shared packages
        run: pnpm --filter @rfdeck/shared-utils test

      # Both builds, because the end-to-end job runs the real server serving the
      # real bundle — `e2e/serve.mjs` refuses to start without either.
      #
      # The server build was missing from the day the e2e tests were added. It went
      # unnoticed because the job never got this far: the typecheck above failed
      # first, so the hole only surfaced once that was fixed.
      - name: Build server
        run: pnpm --filter @rfdeck/server build

      - name: Build web
        run: pnpm --filter @rfdeck/web build

      # The unit suite cannot fail the way this application has actually
      # broken: a button posting to a path the firmware does not serve, a
      # blank page after a tab woke up, a phone layout that scrolled sideways.
      # These drive the real server, database and socket through a browser.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm exec playwright test

      - name: Upload the report when they fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Shell script syntax
        run: bash -n scripts/install-ubuntu.sh && bash -n scripts/update-server.sh && bash -n scripts/rfdeck

  desktop:
    name: Package desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      DATABASE_URL: file:./ci.db
      # No signing identity in CI; build unsigned rather than fail looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rfdeck/server exec prisma generate

      # The meros-client helper ships inside the app, built for this platform.
      - uses: dtolnay/rust-toolchain@stable

      # Builds the shared packages, web and server, then packages. Never
      # publishes: a CI run is a check that packaging works, not a release.
      - name: Package
        run: pnpm --filter @rfdeck/desktop run package --publish never

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7
